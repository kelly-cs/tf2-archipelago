<div class="bar">
  <h3>Mission pool</h3>
  <span class="count">{{ chosen() }} of {{ store.missionPool().length }} in the pool</span>
  <app-search-box label="Find a mission" [(text)]="filter" />
  <app-button size="small" (press)="setShown(true)">Tick shown</app-button>
  <app-button size="small" (press)="setShown(false)">Untick shown</app-button>
</div>

@if (rows().length === 0) {
  <app-empty-state>No mission matches that filter.</app-empty-state>
} @else {
  <app-missions-table
    [rows]="rows()"
    [pool]="true"
    [mods]="true"
    initialSort="map"
    (toggled)="flip($event)"
  />
}
