<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mann vs Archipelago</title>
    <style>
      :root {
        font:
          14px system-ui,
          sans-serif;
        color-scheme: light dark;
        --bg: #15171a;
        --panel: #20242a;
        --muted: #aab0ba;
        --line: #3a4049;
        --accent: #e6a43b;
        --good: #3ca75c;
        --bad: #dc4c4c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #eee;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        padding: 0.42rem 0.72rem;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #303640;
        color: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #17120a;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.6rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 4;
      }
      header .grow {
        flex: 1;
      }
      .light {
        font-size: 1.25rem;
      }
      .stopped {
        color: var(--bad);
      }
      .starting {
        color: var(--accent);
      }
      .running {
        color: var(--good);
      }
      #joinbar {
        padding: 0.4rem 1rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 0.6rem;
        align-items: center;
      }
      #join {
        flex: 1;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      nav {
        display: flex;
        gap: 0.2rem;
        padding: 0.45rem 1rem 0;
      }
      nav button.active {
        border-bottom-color: var(--accent);
        color: var(--accent);
      }
      main {
        padding: 0.7rem 1rem;
        height: calc(100vh - 126px);
        overflow: hidden;
      }
      .pane {
        display: none;
        height: 100%;
        min-height: 0;
      }
      .pane.active {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .pane-head {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        min-height: 2rem;
      }
      .pane-head p {
        margin: 0.2rem 0;
      }
      .pane-head .grow {
        flex: 1;
      }
      .list {
        min-height: 0;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 0.25rem 0.42rem;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      th {
        color: var(--muted);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 1;
        white-space: nowrap;
      }
      td button {
        padding: 0.24rem 0.5rem;
      }
      .locked {
        color: var(--muted);
      }
      .played {
        color: var(--good);
      }
      #loglines {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px ui-monospace,
          monospace;
        margin: 0;
        min-height: 0;
        flex: 1;
        overflow: auto;
        background: #0e0f11;
        padding: 0.6rem;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      .rcon {
        display: flex;
        gap: 0.5rem;
        margin: 0;
      }
      .rcon input {
        flex: 1;
      }
      .notice {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        max-width: 34rem;
        padding: 0.8rem 1rem;
        background: #543d18;
        border: 1px solid var(--accent);
        border-radius: 6px;
        z-index: 8;
      }
      .hidden {
        display: none;
      }
      dialog {
        width: min(1180px, 96vw);
        height: min(820px, 94vh);
        padding: 0;
        border: 1px solid var(--line);
        background: var(--bg);
        color: inherit;
      }
      dialog > header {
        position: sticky;
        top: 0;
        z-index: 2;
      }
      .restart-option {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .settings {
        display: grid;
        grid-template-columns: 175px 1fr;
        height: calc(100% - 52px);
      }
      #settings-tabs {
        border-right: 1px solid var(--line);
        padding: 0.5rem;
        overflow: auto;
      }
      #settings-tabs button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 0.15rem 0;
      }
      .fields {
        padding: 0.7rem 1rem;
        overflow: auto;
      }
      .actionbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        padding: 0 0 0.65rem;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 1;
      }
      .actionbar button {
        font-weight: 600;
      }
      .field {
        display: grid;
        grid-template-columns: minmax(135px, 210px) 1fr;
        gap: 0.25rem 0.8rem;
        padding: 0.42rem 0;
        border-bottom: 1px solid var(--line);
      }
      .field small {
        grid-column: 2;
        color: var(--muted);
        font-size: 12px;
      }
      .field input[type="text"],
      .field input[type="password"],
      .field input[type="number"],
      .field select {
        width: 100%;
        padding: 0.32rem;
      }
      .field .reason {
        color: var(--accent);
      }
      .pool-wrap {
        margin-top: 0.7rem;
      }
      .pool-wrap h3 {
        margin: 0.2rem 0 0.45rem;
      }
      .pool-table td:first-child,
      .pool-table th:first-child {
        text-align: center;
        width: 4rem;
      }
      .pool-table td:nth-child(4) {
        font-weight: 600;
      }
      .pool-sort {
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font-weight: 600;
      }
      .pool-table .ready {
        color: var(--good);
      }
      .pool-table .limited {
        color: var(--accent);
      }
      @media (max-width: 700px) {
        header {
          flex-wrap: wrap;
        }
        .settings {
          grid-template-columns: 1fr;
        }
        #settings-tabs {
          display: flex;
          border-right: 0;
          overflow: auto;
        }
        .field {
          grid-template-columns: 1fr;
        }
        .field small {
          grid-column: 1;
        }
        .pool-table {
          min-width: 780px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span id="light" class="light stopped">●</span>
      <strong id="status">stopped</strong>
      <span id="room"></span>
      <span class="grow"></span>
      <button id="start" class="primary">Start</button>
      <button id="restart">Restart</button>
      <button id="joinbt">Join</button>
      <button id="settingsbt">Settings</button>
      <button id="quit">Quit</button>
    </header>
    <div id="joinbar">
      <strong>Join:</strong>
      <span id="join"></span>
      <button id="copy">Copy</button>
    </div>
    <nav>
      <button data-tab="session" class="active">Session</button>
      <button data-tab="unlocks">Unlocks</button>
      <button data-tab="bots">Bots</button>
      <button data-tab="log">Log</button>
    </nav>
    <main>
      <section id="session" class="pane active">
        <div class="pane-head">
          <p id="health">The server is not running.</p>
          <span class="grow"></span>
          <p id="itemserver"></p>
        </div>
        <div class="list">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Mission</th>
                <th>Map</th>
                <th>Source</th>
                <th>Waves</th>
                <th>State</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="missions"></tbody>
          </table>
        </div>
      </section>
      <section id="unlocks" class="pane">
        <div class="pane-head"><p id="unlock-status"></p></div>
        <div class="list">
          <table>
            <thead>
              <tr>
                <th>Kind</th>
                <th>Unlock</th>
                <th>Level</th>
              </tr>
            </thead>
            <tbody id="unlock-rows"></tbody>
          </table>
        </div>
      </section>
      <section id="bots" class="pane">
        <div class="pane-head">
          <p id="bot-status"></p>
          <span class="grow"></span>
          <button id="changebots">Change the team</button>
        </div>
        <div class="list">
          <table>
            <thead>
              <tr>
                <th>Seat</th>
                <th>Class</th>
                <th>Weapons</th>
              </tr>
            </thead>
            <tbody id="bot-rows"></tbody>
          </table>
        </div>
      </section>
      <section id="log" class="pane">
        <form id="rcon" class="rcon">
          <label for="command">rcon</label>
          <input id="command" autocomplete="off" />
          <button class="primary">Send</button>
        </form>
        <pre id="loglines"></pre>
      </section>
    </main>
    <input
      id="asset-import"
      class="hidden"
      type="file"
      accept=".zip,application/zip"
      multiple
    />
    <div id="notice" class="notice hidden"></div>
    <dialog id="settings">
      <header>
        <strong>Settings</strong>
        <span class="grow"></span>
        <label id="restart-option" class="restart-option hidden">
          <input id="restart-on-save" type="checkbox" checked />
          Restart on save
        </label>
        <button id="save">Save</button>
        <button id="cancel">Cancel</button>
      </header>
      <div class="settings">
        <div id="settings-tabs"></div>
        <div id="fields" class="fields"></div>
      </div>
    </dialog>
    <script>
      const $ = (id) => document.getElementById(id);
      let queue = Promise.resolve(),
        state,
        formTab = "",
        formKey = "",
        logsLoaded = false,
        lastLog = "",
        noticeSeq = 0,
        poolSort = { key: "map", direction: 1 };
      function enqueue(request) {
        queue = queue.catch(() => {}).then(request);
        return queue;
      }

      async function requireSuccess(response) {
        if (!response.ok) throw Error(await response.text());
      }

      function post(url, body = {}) {
        return enqueue(async () => {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          await requireSuccess(response);
        });
      }
      const browserActions = {
        "run.generate": "/api/files/seed",
        "run.open_player_file": "/api/files/player",
        "run.open_folder": "/api/files/install",
        "run.open_settings_file": "/api/files/settings",
        "server.debug_bundle": "/api/files/debug",
        "net.check_funnel": "/api/open/funnel",
      };
      const FieldKind = Object.freeze({
        text: "text",
        password: "password",
        number: "number",
        toggle: "toggle",
        choice: "choice",
        action: "action",
        confirm: "confirm",
      });
      const editableFieldKinds = new Set([
        FieldKind.text,
        FieldKind.password,
        FieldKind.number,
        FieldKind.toggle,
        FieldKind.choice,
      ]);

      function isActionKind(kind) {
        return kind === FieldKind.action || kind === FieldKind.confirm;
      }
      function text(value) {
        return document.createTextNode(value ?? "");
      }
      function el(tag, attrs = {}, ...kids) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") n.className = v;
          else if (k === "disabled") n.disabled = v;
          else n.setAttribute(k, v);
        }
        for (const kid of kids) n.append(kid instanceof Node ? kid : text(kid));
        return n;
      }
      const logKey = (line) =>
        line ? `${line.At}\0${line.Source}\0${line.Text}` : "";
      function logLine(line) {
        const box = $("loglines"),
          at = new Date(line.At).toLocaleTimeString([], { hour12: false });
        box.append(
          text(`${at}  ${(line.Source || "").padEnd(8)} ${line.Text}\n`),
        );
        while (box.childNodes.length > 20000) box.firstChild.remove();
        box.scrollTop = box.scrollHeight;
        lastLog = logKey(line);
      }
      function drawHeader(snapshot) {
        document.title = snapshot.title;
        $("status").textContent = snapshot.status;
        $("light").className = "light " + snapshot.status;
        $("room").textContent = snapshot.room;
        $("join").textContent = snapshot.join;
        $("start").textContent =
          snapshot.running || snapshot.busy ? "Stop" : "Start";
        $("restart").disabled = !snapshot.running;
        $("joinbt").disabled = !snapshot.running || !snapshot.join_url;
        $("command").disabled = !snapshot.running;
      }

      function drawLogs(logs) {
        if (!logsLoaded || logKey(logs.at(-1)) !== lastLog) {
          $("loglines").replaceChildren();
          lastLog = "";
          for (const line of logs) logLine(line);
          logsLoaded = true;
        }
      }

      function missionStatus(mission) {
        if (mission.played) return "cleared";
        if (mission.cleared) return "collected";
        if (mission.unlocked) return "unlocked";
        return "locked";
      }

      function missionRow(mission, index, running) {
        const play = el(
          "button",
          { disabled: !running || !mission.unlocked },
          "Play this mission",
        );
        play.onclick = () =>
          post("/api/mission", { popfile: mission.popfile }).catch(notice);
        return el(
          "tr",
          {
            class: mission.played ? "played" : mission.unlocked ? "" : "locked",
          },
          el("td", {}, index + 1),
          el("td", {}, mission.name),
          el("td", {}, mission.map),
          el("td", {}, mission.source),
          el("td", {}, mission.waves),
          el("td", {}, missionStatus(mission)),
          el("td", {}, play),
        );
      }

      function drawSession(snapshot) {
        const health = snapshot.session.Health || {};
        if (snapshot.session_error) {
          $("health").textContent = "Bridge: " + snapshot.session_error;
        } else if (!snapshot.running) {
          $("health").textContent = "The server is not running.";
        } else if (!health.connected) {
          $("health").textContent = "not connected yet";
        } else {
          $("health").textContent =
            `connected as ${health.slot}, ${health.checks} checks, ${health.items} items`;
        }
        $("itemserver").textContent = snapshot.item_server || "";
        $("missions").replaceChildren(
          ...(snapshot.session.Missions || []).map((mission, index) =>
            missionRow(mission, index, snapshot.running),
          ),
        );
      }

      function drawUnlocks(snapshot) {
        $("unlock-status").textContent = snapshot.running
          ? "Everything this run has received."
          : "The server is not running.";
        $("unlock-rows").replaceChildren(
          ...(snapshot.session.Unlocks || []).map((unlock) =>
            el(
              "tr",
              {},
              el("td", {}, unlock.Kind),
              el("td", {}, unlock.Name),
              el("td", {}, unlock.Level),
            ),
          ),
        );
      }

      function drawBots(snapshot) {
        const seats = snapshot.bots || [];
        const drawn = snapshot.drawn_bots
          ? " The mod draws the rest from: " + snapshot.drawn_bots
          : "";
        $("bot-status").textContent =
          `RED holds ${seats.length}, humans included.${drawn}`;
        $("bot-rows").replaceChildren(
          ...seats.map((seat) =>
            el(
              "tr",
              {},
              el("td", {}, seat.Number),
              el("td", {}, seat.Class),
              el("td", {}, seat.Weapons),
            ),
          ),
        );
      }

      function drawNotice(snapshot) {
        if (snapshot.notice && snapshot.notice_seq !== noticeSeq) {
          noticeSeq = snapshot.notice_seq;
          notice(snapshot.notice);
        }
      }

      function drawSettings(snapshot) {
        if (snapshot.form) {
          const opening = !$("settings").open;
          const key = JSON.stringify([snapshot.form, snapshot.mission_pool]);
          if (key !== formKey) {
            formKey = key;
            drawForm(snapshot.form);
          }
          $("restart-option").classList.toggle(
            "hidden",
            !snapshot.restart_needed,
          );
          if (opening) {
            $("restart-on-save").checked = true;
            $("settings").showModal();
          }
        } else {
          formKey = "";
          $("restart-option").classList.add("hidden");
          if ($("settings").open) $("settings").close();
        }
      }

      function draw(snapshot) {
        state = snapshot;
        drawHeader(snapshot);
        drawLogs(snapshot.logs || []);
        drawSession(snapshot);
        drawUnlocks(snapshot);
        drawBots(snapshot);
        drawNotice(snapshot);
        drawSettings(snapshot);
      }

      function actionControl(field) {
        const control = el("button", {}, field.label);
        control.onclick = () => {
          if (field.id === "missions.import_assets") {
            $("asset-import").click();
            return;
          }
          const url = browserActions[field.id];
          if (url) {
            window.open(url, "_blank");
            return;
          }
          if (
            field.kind === FieldKind.confirm &&
            !confirm(field.warning || "Are you sure?")
          ) {
            return;
          }
          post("/api/settings/action", { id: field.id }).catch(notice);
        };
        return control;
      }

      function choiceControl(field) {
        const control = el("select");
        for (const option of field.options || []) {
          const item = el("option", { value: option.value }, option.label);
          item.selected = option.value === field.value;
          control.append(item);
        }
        return control;
      }

      function inputControl(field) {
        const inputTypes = {
          [FieldKind.text]: "text",
          [FieldKind.password]: "password",
          [FieldKind.number]: "number",
        };
        const control = el("input", {
          type: inputTypes[field.kind],
          placeholder: field.placeholder || "",
          value: field.value || "",
        });
        if (field.kind === FieldKind.number) {
          control.min = field.low;
          control.max = field.high;
        }
        return control;
      }

      function fieldControl(field) {
        let control;
        switch (field.kind) {
          case FieldKind.toggle:
            control = el("input", { type: "checkbox" });
            control.checked = field.value === "true";
            break;
          case FieldKind.choice:
            control = choiceControl(field);
            break;
          case FieldKind.action:
          case FieldKind.confirm:
            control = actionControl(field);
            break;
          case FieldKind.text:
          case FieldKind.password:
          case FieldKind.number:
            control = inputControl(field);
            break;
          default:
            throw new Error(`unsupported field kind: ${field.kind}`);
        }

        control.disabled = Boolean(field.disabled);
        if (editableFieldKinds.has(field.kind)) {
          control.onchange = () => {
            const value =
              field.kind === FieldKind.toggle
                ? String(control.checked)
                : control.value;
            post("/api/settings/change", { field: field.id, value }).catch(
              notice,
            );
          };
        }
        return control;
      }
      function fieldRow(field) {
        const row = el(
          "div",
          { class: "field" },
          el("label", {}, field.label),
          fieldControl(field),
          el("small", {}, field.help),
        );
        if (field.reason) {
          row.append(el("small", { class: "reason" }, field.reason));
        }
        return row;
      }

      function missionPoolSortValue(mission, field, key) {
        if (key === "in_pool") return field.value === "true" ? 1 : 0;
        if (key === "waves") return Number(mission.waves.match(/\d+$/)?.[0]);
        return mission[key] || "";
      }

      function sortedMissionPool(fieldsByID) {
        const rows = (state.mission_pool || [])
          .map((mission, index) => ({
            mission,
            field: fieldsByID.get(mission.field),
            index,
          }))
          .filter((row) => row.field);
        if (!poolSort.key) return rows;
        return rows.sort((left, right) => {
          const a = missionPoolSortValue(
              left.mission,
              left.field,
              poolSort.key,
            ),
            b = missionPoolSortValue(
              right.mission,
              right.field,
              poolSort.key,
            );
          const order =
            typeof a === "number"
              ? a - b
              : String(a).localeCompare(String(b), undefined, {
                  numeric: true,
                  sensitivity: "base",
                });
          return order ? order * poolSort.direction : left.index - right.index;
        });
      }

      function missionPoolHeader(key, label) {
        const active = poolSort.key === key;
        const direction =
          active && poolSort.direction < 0 ? "descending" : "ascending";
        const button = el(
          "button",
          { class: "pool-sort", type: "button" },
          label + (active ? (poolSort.direction > 0 ? " ▲" : " ▼") : ""),
        );
        button.onclick = () => {
          if (active) poolSort.direction *= -1;
          else poolSort = { key, direction: 1 };
          drawForm(state.form);
        };
        return el("th", { "aria-sort": active ? direction : "none" }, button);
      }

      function missionPool(fields) {
        const fieldsByID = new Map(fields.map((field) => [field.id, field]));
        const rows = [];
        for (const { mission, field } of sortedMissionPool(fieldsByID)) {
          const toggle = fieldControl(field);
          const status = el(
            "span",
            {
              class: mission.compatibility === "Ready" ? "ready" : "limited",
            },
            mission.compatibility,
          );
          rows.push(
            el(
              "tr",
              { title: field.help },
              el("td", {}, toggle),
              el("td", {}, mission.source),
              el("td", {}, mission.map),
              el("td", {}, mission.name),
              el("td", {}, mission.waves),
              el("td", {}, status),
              el("td", {}, mission.mods),
            ),
          );
        }
        if (!rows.length) return null;
        return el(
          "div",
          { class: "pool-wrap" },
          el("h3", {}, "Mission pool"),
          el(
            "div",
            { class: "list" },
            el(
              "table",
              { class: "pool-table" },
              el(
                "thead",
                {},
                el(
                  "tr",
                  {},
                  missionPoolHeader("in_pool", "In pool"),
                  missionPoolHeader("source", "Source"),
                  missionPoolHeader("map", "Map"),
                  missionPoolHeader("name", "Mission name"),
                  missionPoolHeader("waves", "Wave #s"),
                  missionPoolHeader("compatibility", "Compatibility status"),
                  missionPoolHeader("mods", "Mods"),
                ),
              ),
              el("tbody", {}, ...rows),
            ),
          ),
        );
      }
      function drawForm(model) {
        const tabs = model.tabs || [];
        if (
          !formTab ||
          !tabs.some((candidate) => candidate.title === formTab)
        ) {
          formTab = state.form_page || tabs[0]?.title || "";
        }
        $("settings-tabs").replaceChildren(
          ...tabs.map((candidate) => {
            const button = el(
              "button",
              { class: candidate.title === formTab ? "active" : "" },
              candidate.title,
            );
            button.onclick = () => {
              formTab = candidate.title;
              drawForm(model);
            };
            return button;
          }),
        );
        const page = tabs.find((candidate) => candidate.title === formTab);
        if (!page) return;

        const fields = page.fields || [];
        const actions = fields.filter((field) => isActionKind(field.kind));
        const regular = fields.filter(
          (field) =>
            !isActionKind(field.kind) && !field.id.startsWith("missions.pool."),
        );
        const rows = [];
        if (actions.length) {
          rows.push(
            el("div", { class: "actionbar" }, ...actions.map(fieldControl)),
          );
        }
        if (page.intro) rows.push(el("p", {}, page.intro));
        rows.push(...regular.map(fieldRow));
        const pool = missionPool(fields);
        if (pool) rows.push(pool);
        $("fields").replaceChildren(...rows);
      }
      function notice(message) {
        const box = $("notice"),
          match = String(message).match(/https?:\/\/\S+/);
        box.replaceChildren(text(message));
        if (match)
          box.append(
            " ",
            el(
              "a",
              { href: match[0], target: "_blank", rel: "noreferrer" },
              "Open",
            ),
          );
        box.classList.remove("hidden");
        clearTimeout(notice.timer);
        notice.timer = setTimeout(() => box.classList.add("hidden"), 7000);
      }
      async function refresh() {
        try {
          const response = await fetch("/api/snapshot");
          await requireSuccess(response);
          draw(await response.json());
        } catch (error) {
          notice(error.message);
        }
      }

      function selectTab(button) {
        return () => {
          document
            .querySelectorAll("nav button,.pane")
            .forEach((element) => element.classList.remove("active"));
          button.classList.add("active");
          $(button.dataset.tab).classList.add("active");
        };
      }

      function bindNavigation() {
        for (const button of document.querySelectorAll("nav button")) {
          button.onclick = selectTab(button);
        }
      }

      async function importAssets(input) {
        const files = [...input.files];
        input.value = "";
        if (!files.length) return;

        const body = new FormData();
        for (const file of files) body.append("assets", file);
        return enqueue(async () => {
          const response = await fetch("/api/settings/import", {
            method: "POST",
            body,
          });
          await requireSuccess(response);
        });
      }

      function sendRCON(event) {
        event.preventDefault();
        const input = $("command");
        const command = input.value.trim();
        if (!command) return;

        input.value = "";
        post("/api/rcon", { command }).catch(notice);
      }

      function bindActions() {
        $("asset-import").onchange = (event) =>
          importAssets(event.target).catch(notice);
        $("start").onclick = () => {
          const action = state.running || state.busy ? "stop" : "start";
          post(`/api/server/${action}`).catch(notice);
        };
        $("restart").onclick = () => post("/api/server/restart").catch(notice);
        $("joinbt").onclick = () => (window.location.href = state.join_url);
        $("copy").onclick = () =>
          navigator.clipboard
            .writeText(state.join)
            .catch((error) => notice(error.message));
        $("settingsbt").onclick = () =>
          post("/api/settings/open").catch(notice);
        $("changebots").onclick = () =>
          post("/api/settings/open", { page: "Bots" }).catch(notice);
        $("quit").onclick = () => {
          if (confirm("Stop the server and quit?")) post("/api/quit");
        };
        $("rcon").onsubmit = sendRCON;
        $("cancel").onclick = () => post("/api/settings/cancel").catch(notice);
        $("save").onclick = () =>
          post("/api/settings/save", {
            restart: $("restart-on-save").checked,
          }).catch(notice);
      }

      function connectEvents() {
        const events = new EventSource("/api/events");
        events.addEventListener("log", (event) =>
          logLine(JSON.parse(event.data)),
        );
        events.addEventListener("state", refresh);
        events.onerror = () =>
          notice("The launcher connection was interrupted; reconnecting…");
      }

      bindNavigation();
      bindActions();
      connectEvents();
      refresh();
    </script>
  </body>
</html>
