<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mann vs Archipelago</title><style>
:root{font:14px system-ui,sans-serif;color-scheme:light dark;--bg:#15171a;--panel:#20242a;--muted:#aab0ba;--line:#3a4049;--accent:#e6a43b;--good:#3ca75c;--bad:#dc4c4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eee}button,input,select{font:inherit}button{padding:.42rem .72rem;border:1px solid var(--line);border-radius:5px;background:#303640;color:inherit;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#17120a;font-weight:700}button:disabled{opacity:.45;cursor:default}header{display:flex;align-items:center;gap:.55rem;padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}header .grow{flex:1}.light{font-size:1.25rem}.stopped{color:var(--bad)}.starting{color:var(--accent)}.running{color:var(--good)}#joinbar{padding:.4rem 1rem;border-bottom:1px solid var(--line);display:flex;gap:.6rem;align-items:center}#join{flex:1;color:var(--muted);overflow-wrap:anywhere}nav{display:flex;gap:.2rem;padding:.45rem 1rem 0}nav button.active{border-bottom-color:var(--accent);color:var(--accent)}main{padding:.7rem 1rem;height:calc(100vh - 126px);overflow:hidden}.pane{display:none;height:100%;min-height:0}.pane.active{display:flex;flex-direction:column;gap:.5rem}.pane-head{display:flex;align-items:center;gap:.7rem;min-height:2rem}.pane-head p{margin:.2rem 0}.pane-head .grow{flex:1}.list{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:5px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:.25rem .42rem;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);background:var(--panel);position:sticky;top:0;z-index:1;white-space:nowrap}td button{padding:.24rem .5rem}.locked{color:var(--muted)}.played{color:var(--good)}#loglines{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;margin:0;min-height:0;flex:1;overflow:auto;background:#0e0f11;padding:.6rem;border:1px solid var(--line);border-radius:5px}.rcon{display:flex;gap:.5rem;margin:0}.rcon input{flex:1}.notice{position:fixed;right:1rem;bottom:1rem;max-width:34rem;padding:.8rem 1rem;background:#543d18;border:1px solid var(--accent);border-radius:6px;z-index:8}.hidden{display:none}dialog{width:min(1180px,96vw);height:min(820px,94vh);padding:0;border:1px solid var(--line);background:var(--bg);color:inherit}dialog>header{position:sticky;top:0;z-index:2}.settings{display:grid;grid-template-columns:175px 1fr;height:calc(100% - 52px)}#settings-tabs{border-right:1px solid var(--line);padding:.5rem;overflow:auto}#settings-tabs button{display:block;width:100%;text-align:left;margin:.15rem 0}.fields{padding:.7rem 1rem;overflow:auto}.actionbar{display:flex;flex-wrap:wrap;gap:.4rem;padding:0 0 .65rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}.actionbar button{font-weight:600}.field{display:grid;grid-template-columns:minmax(135px,210px) 1fr;gap:.25rem .8rem;padding:.42rem 0;border-bottom:1px solid var(--line)}.field small{grid-column:2;color:var(--muted);font-size:12px}.field input[type=text],.field input[type=password],.field input[type=number],.field select{width:100%;padding:.32rem}.field .reason{color:var(--accent)}.pool-wrap{margin-top:.7rem}.pool-wrap h3{margin:.2rem 0 .45rem}.pool-table td:first-child,.pool-table th:first-child{text-align:center;width:4rem}.pool-table td:nth-child(3){font-weight:600}.pool-table .ready{color:var(--good)}.pool-table .limited{color:var(--accent)}@media(max-width:700px){header{flex-wrap:wrap}.settings{grid-template-columns:1fr}#settings-tabs{display:flex;border-right:0;overflow:auto}.field{grid-template-columns:1fr}.field small{grid-column:1}.pool-table{min-width:680px}}
</style></head><body>
<header><span id="light" class="light stopped">●</span><strong id="status">stopped</strong><span id="room"></span><span class="grow"></span><button id="start" class="primary">Start</button><button id="restart">Restart</button><button id="joinbt">Join</button><button id="settingsbt">Settings</button><button id="quit">Quit</button></header>
<div id="joinbar"><strong>Join:</strong><span id="join"></span><button id="copy">Copy</button></div>
<nav><button data-tab="session" class="active">Session</button><button data-tab="unlocks">Unlocks</button><button data-tab="bots">Bots</button><button data-tab="log">Log</button></nav>
<main><section id="session" class="pane active"><div class="pane-head"><p id="health">The server is not running.</p><span class="grow"></span><p id="itemserver"></p></div><div class="list"><table><thead><tr><th>#</th><th>Mission</th><th>Map</th><th>Source</th><th>Waves</th><th>State</th><th></th></tr></thead><tbody id="missions"></tbody></table></div></section>
<section id="unlocks" class="pane"><div class="pane-head"><p id="unlock-status"></p></div><div class="list"><table><thead><tr><th>Kind</th><th>Unlock</th><th>Level</th></tr></thead><tbody id="unlock-rows"></tbody></table></div></section>
<section id="bots" class="pane"><div class="pane-head"><p id="bot-status"></p><span class="grow"></span><button id="changebots">Change the team</button></div><div class="list"><table><thead><tr><th>Seat</th><th>Class</th><th>Weapons</th></tr></thead><tbody id="bot-rows"></tbody></table></div></section>
<section id="log" class="pane"><form id="rcon" class="rcon"><label for="command">rcon</label><input id="command" autocomplete="off"><button class="primary">Send</button></form><pre id="loglines"></pre></section></main>
<input id="asset-import" class="hidden" type="file" accept=".zip,application/zip" multiple><div id="notice" class="notice hidden"></div><dialog id="settings"><header><strong>Settings</strong><span class="grow"></span><button id="save">Save</button><button id="cancel">Cancel</button></header><div class="settings"><div id="settings-tabs"></div><div id="fields" class="fields"></div></div></dialog>
<script>
const $=id=>document.getElementById(id);let queue=Promise.resolve(),state,tab='session',formTab='',formKey='',logsLoaded=false,lastLog='',noticeSeq=0;const post=(url,body={})=>queue=queue.catch(()=>{}).then(()=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{if(!r.ok)throw Error(await r.text())}));
const browserActions={'run.generate':'/api/files/seed','run.open_player_file':'/api/files/player','run.open_folder':'/api/files/install/','run.open_settings_file':'/api/files/settings','server.debug_bundle':'/api/files/debug','net.check_funnel':'/api/open/funnel'};
function text(value){return document.createTextNode(value??'')}function el(tag,attrs={},...kids){const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='disabled')n.disabled=v;else n.setAttribute(k,v)}for(const kid of kids)n.append(kid instanceof Node?kid:text(kid));return n}
const logKey=line=>line?`${line.At}\0${line.Source}\0${line.Text}`:'';function logLine(line){const box=$('loglines'),at=new Date(line.At).toLocaleTimeString([], {hour12:false});box.append(text(`${at}  ${(line.Source||'').padEnd(8)} ${line.Text}\n`));while(box.childNodes.length>20000)box.firstChild.remove();box.scrollTop=box.scrollHeight;lastLog=logKey(line)}
function draw(s){state=s;document.title=s.title;$('status').textContent=s.status;$('light').className='light '+s.status;$('room').textContent=s.room;$('join').textContent=s.join;$('start').textContent=s.running||s.busy?'Stop':'Start';$('restart').disabled=!s.running;$('joinbt').disabled=!s.running||!s.join_url;$('command').disabled=!s.running;
const logs=s.logs||[];if(!logsLoaded||logKey(logs.at(-1))!==lastLog){$('loglines').replaceChildren();lastLog='';for(const line of logs)logLine(line);logsLoaded=true}
const h=s.session.Health||{};$('health').textContent=s.session_error?'Bridge: '+s.session_error:s.running?(h.Connected?`connected as ${h.Slot}, ${h.Checks} checks, ${h.Items} items`:'not connected yet'):'The server is not running.';$('itemserver').textContent=s.item_server||'';
$('missions').replaceChildren(...(s.session.Missions||[]).map((m,i)=>{const status=m.Played?'cleared':m.Cleared?'collected':m.Unlocked?'unlocked':'locked',bt=el('button',{disabled:!s.running||!m.Unlocked},'Play this mission');bt.onclick=()=>post('/api/mission',{popfile:m.PopFile}).catch(notice);return el('tr',{class:m.Played?'played':m.Unlocked?'':'locked'},el('td',{},i+1),el('td',{},m.Name),el('td',{},m.Map),el('td',{},m.Source),el('td',{},m.Waves),el('td',{},status),el('td',{},bt))}));
$('unlock-status').textContent=s.running?'Everything this run has received.':'The server is not running.';$('unlock-rows').replaceChildren(...(s.session.Unlocks||[]).map(u=>el('tr',{},el('td',{},u.Kind),el('td',{},u.Name),el('td',{},u.Level))));
$('bot-status').textContent=`RED holds ${(s.bots||[]).length}, humans included.${s.drawn_bots?' The mod draws the rest from: '+s.drawn_bots:''}`;$('bot-rows').replaceChildren(...(s.bots||[]).map(b=>el('tr',{},el('td',{},b.Number),el('td',{},b.Class),el('td',{},b.Weapons))));
if(s.notice&&s.notice_seq!==noticeSeq){noticeSeq=s.notice_seq;notice(s.notice)}if(s.form){const key=JSON.stringify([s.form,s.mission_pool]);if(key!==formKey){formKey=key;drawForm(s.form)}if(!$('settings').open)$('settings').showModal()}else{formKey='';if($('settings').open)$('settings').close()}}
function fieldControl(f){let control;if(f.kind===4){control=el('input',{type:'checkbox'});control.checked=f.value==='true'}else if(f.kind===5){control=el('select');for(const o of f.options||[]){const opt=el('option',{value:o.value},o.label);opt.selected=o.value===f.value;control.append(opt)}}else if(f.kind===6||f.kind===7){control=el('button',{},f.label);control.onclick=()=>{if(f.id==='missions.import_assets'){$('asset-import').click();return}const url=browserActions[f.id];if(url){open(url,'_blank');return}if(f.kind===7&&!confirm(f.warning||'Are you sure?'))return;post('/api/settings/action',{id:f.id}).catch(notice)}}else{control=el('input',{type:f.kind===2?'password':f.kind===3?'number':'text',placeholder:f.placeholder||'',value:f.value||''});if(f.kind===3){control.min=f.low;control.max=f.high}}control.disabled=!!f.disabled;if(f.kind<6)control.onchange=()=>post('/api/settings/change',{field:f.id,value:f.kind===4?String(control.checked):control.value}).catch(notice);return control}
function fieldRow(f){const row=el('div',{class:'field'},el('label',{},f.label),fieldControl(f),el('small',{},f.help));if(f.reason)row.append(el('small',{class:'reason'},f.reason));return row}
function missionPool(fields){const byID=new Map(fields.map(f=>[f.id,f])),rows=[];for(const m of state.mission_pool||[]){const f=byID.get(m.field);if(!f)continue;const box=fieldControl(f),status=el('span',{class:m.compatibility==='Ready'?'ready':'limited'},m.compatibility);rows.push(el('tr',{title:f.help},el('td',{},box),el('td',{},m.source),el('td',{},m.name),el('td',{},m.waves),el('td',{},status),el('td',{},m.mods)))}if(!rows.length)return null;return el('div',{class:'pool-wrap'},el('h3',{},'Mission pool'),el('div',{class:'list'},el('table',{class:'pool-table'},el('thead',{},el('tr',{},el('th',{},'In pool'),el('th',{},'Source'),el('th',{},'Mission name'),el('th',{},'Wave #s'),el('th',{},'Compatibility status'),el('th',{},'Mods'))),el('tbody',{},...rows))))}
function drawForm(model){const tabs=model.tabs||[];if(!formTab||!tabs.some(t=>t.title===formTab))formTab=state.form_page||tabs[0]?.title||'';$('settings-tabs').replaceChildren(...tabs.map(t=>{const b=el('button',{class:t.title===formTab?'active':''},t.title);b.onclick=()=>{formTab=t.title;drawForm(model)};return b}));const page=tabs.find(t=>t.title===formTab);if(!page)return;const fields=page.fields||[],actions=fields.filter(f=>f.kind>=6),regular=fields.filter(f=>f.kind<6&&!f.id.startsWith('missions.pool.')),rows=[];if(actions.length)rows.push(el('div',{class:'actionbar'},...actions.map(fieldControl)));if(page.intro)rows.push(el('p',{},page.intro));rows.push(...regular.map(fieldRow));const pool=missionPool(fields);if(pool)rows.push(pool);$('fields').replaceChildren(...rows)}
function notice(message){const box=$('notice'),match=String(message).match(/https?:\/\/\S+/);box.replaceChildren(text(message));if(match)box.append(' ',el('a',{href:match[0],target:'_blank',rel:'noreferrer'},'Open'));box.classList.remove('hidden');clearTimeout(notice.timer);notice.timer=setTimeout(()=>box.classList.add('hidden'),7000)}async function refresh(){try{draw(await fetch('/api/snapshot').then(r=>r.json()))}catch(e){notice(e.message)}}
for(const b of document.querySelectorAll('nav button'))b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(tab).classList.add('active')};
$('asset-import').onchange=e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;const body=new FormData;for(const file of files)body.append('assets',file);queue=queue.catch(()=>{}).then(()=>fetch('/api/settings/import',{method:'POST',body}).then(async r=>{if(!r.ok)throw Error(await r.text())})).catch(notice)};
$('start').onclick=()=>post('/api/server/'+(state.running||state.busy?'stop':'start')).catch(notice);$('restart').onclick=()=>post('/api/server/restart').catch(notice);$('joinbt').onclick=()=>location.href=state.join_url;$('copy').onclick=()=>navigator.clipboard.writeText(state.join).catch(e=>notice(e.message));$('settingsbt').onclick=()=>post('/api/settings/open').catch(notice);$('changebots').onclick=()=>post('/api/settings/open',{page:'Bots'}).catch(notice);$('quit').onclick=()=>{if(confirm('Stop the server and quit?'))post('/api/quit')};$('rcon').onsubmit=e=>{e.preventDefault();const input=$('command'),command=input.value.trim();if(command){input.value='';post('/api/rcon',{command}).catch(notice)}};$('cancel').onclick=()=>post('/api/settings/cancel').catch(notice);$('save').onclick=()=>post('/api/settings/save').catch(notice);
const events=new EventSource('/api/events');events.addEventListener('log',e=>logLine(JSON.parse(e.data)));events.addEventListener('state',refresh);events.onerror=()=>notice('The launcher connection was interrupted; reconnecting…');refresh();
</script></body></html>
