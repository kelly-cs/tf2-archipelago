<svg xmlns="http://www.w3.org/2000/svg" width="464" height="790" viewBox="0 0 464 790" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="464" height="790" rx="10" fill="#1b1f27"/>
