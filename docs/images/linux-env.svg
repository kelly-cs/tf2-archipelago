<text text-anchor="middle" x="232" y="22" fill="#8b94a7">tf2ap-linux-amd64 -env</text>
<text x="18" y="66" fill="#d5dae5" xml:space="preserve">These override the saved configuration for one run:</text>
<text x="18" y="86" fill="#d5dae5" xml:space="preserve">  TF2AP_INSTALL_ROOT             (set)</text>
<text x="18" y="106" fill="#d5dae5" xml:space="preserve">  TF2AP_TEST_MODE</text>
<text x="18" y="126" fill="#d5dae5" xml:space="preserve">  TF2AP_ARCHIPELAGO_DIR          (set)</text>
<text x="18" y="146" fill="#d5dae5" xml:space="preserve">  AP_ROOM</text>
<text x="18" y="166" fill="#d5dae5" xml:space="preserve">  AP_HOST                        (set)</text>
<text x="18" y="186" fill="#d5dae5" xml:space="preserve">  AP_PORT                        (set)</text>
<text x="18" y="206" fill="#d5dae5" xml:space="preserve">  AP_TLS</text>
<text x="18" y="226" fill="#d5dae5" xml:space="preserve">  AP_SLOT_NAME</text>
<text x="18" y="246" fill="#d5dae5" xml:space="preserve">  AP_PASSWORD</text>
<text x="18" y="266" fill="#d5dae5" xml:space="preserve">  SRCDS_HOSTNAME</text>
<text x="18" y="286" fill="#d5dae5" xml:space="preserve">  SRCDS_RCONPW                   (set)</text>
<text x="18" y="306" fill="#d5dae5" xml:space="preserve">  SRCDS_PW</text>
<text x="18" y="326" fill="#d5dae5" xml:space="preserve">  SRCDS_PORT</text>
<text x="18" y="346" fill="#d5dae5" xml:space="preserve">  SRCDS_MAXPLAYERS</text>
<text x="18" y="366" fill="#d5dae5" xml:space="preserve">  SRCDS_START_MISSION</text>
<text x="18" y="386" fill="#d5dae5" xml:space="preserve">  SRCDS_STARTMAP</text>
<text x="18" y="406" fill="#d5dae5" xml:space="preserve">  SRCDS_TOKEN</text>
<text x="18" y="426" fill="#d5dae5" xml:space="preserve">  SRCDS_LAN</text>
